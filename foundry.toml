[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

#OpenZeppelin dependencies also resolve from the base-contracts repository, so it and the PoC use the exact same versions.
remappings = [
    "erc8183/=lib/base-contracts/contracts/",
    "@openzeppelin/contracts/=lib/base-contracts/lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/base-contracts/lib/openzeppelin-contracts-upgradeable/contracts/",
    "forge-std/=lib/forge-std/src/",
]
